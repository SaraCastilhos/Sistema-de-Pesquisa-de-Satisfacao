# Contrato das rotas do módulo manifestacoes, juntado aos demais por src/docs/swagger.js
tags:
  - name: Ouvidoria
    description: Manifestações, outros canais, tentativas de contato, finalização e fotos
paths:
  /api/manifestacoes:
    get:
      tags: [Ouvidoria]
      summary: Lista as manifestações com filtros (só Super Admin)
      description: >
        Lista paginada, da manifestação mais nova para a mais antiga (RF14). Cada item mostra o
        protocolo, a origem, o tipo (null = a classificar), o setor, a etapa, a data, o turno, a nota
        da sessão, o status, se o paciente pediu retorno, se é possível duplicata e o número de
        tentativas de contato. O texto do relato e o telefone NÃO aparecem na lista: só no detalhe do
        chamado (RNF10). A resposta também traz totalNovas, o número de chamados com status NOVA em
        todo o sistema (sem os filtros), para o número do menu lateral.
      security:
        - bearerAuth: []
      parameters:
        - name: pagina
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: tamanho
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [NOVA, EM_CONTATO, ENCERRADA, SEM_RETORNO]
        - name: tipo
          in: query
          required: false
          description: A_CLASSIFICAR traz só as manifestações que ainda não têm tipo (RN12).
          schema:
            type: string
            enum: [ELOGIO, RECLAMACAO, SUGESTAO, A_CLASSIFICAR]
        - name: setorId
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - name: turnoId
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - name: inicio
          in: query
          required: false
          description: Primeiro dia do período, pela data da ocorrência (incluído)
          schema: { type: string, format: date, examples: ['2026-10-01'] }
        - name: fim
          in: query
          required: false
          description: Último dia do período, pela data da ocorrência (incluído)
          schema: { type: string, format: date, examples: ['2026-10-31'] }
        - name: protocolo
          in: query
          required: false
          description: Número de protocolo exato (o id da manifestação)
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Página de manifestações
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestacaoPagina'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
    post:
      tags: [Ouvidoria]
      summary: Registra uma manifestação recebida por outro canal (só Super Admin)
      description: >
        Manifestação recebida por telefone, presencialmente, por e-mail ou por escrito (RF17), que
        segue o mesmo fluxo de chamado da pesquisa e nasce com status NOVA. Quem registra é o usuário
        logado. O tipo é obrigatório, porque quem registra já é a Ouvidoria (RN12). A etapa, se
        anotada, precisa ser uma etapa ativa do mesmo setor; o turno, se informado, precisa estar
        ativo; a data não pode ser depois de hoje. O profissional citado nunca aparece em indicadores
        (RN04). O telefone é opcional e só é aceito com o consentimento obtido no contato, na versão
        vigente dos termos (RN06), com as mesmas regras da pesquisa: normalizado, cifrado, com hash
        para a possível duplicata no mesmo setor em 24 horas (RF19). Texto e profissional citado têm
        o HTML removido (RNF09). O registro vai para o log (CRIACAO), sem o relato, o nome citado e o
        telefone (RNF11). Devolve o chamado criado, como o GET /api/manifestacoes/{id}. O canal
        PESQUISA não é aceito: essa manifestação só nasce pela pesquisa do paciente.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origem, tipo, setorId, dataOcorrencia]
              additionalProperties: false
              properties:
                origem: { type: string, enum: [TELEFONE, PRESENCIAL, EMAIL, PAPEL] }
                tipo: { type: string, enum: [ELOGIO, RECLAMACAO, SUGESTAO] }
                setorId: { type: integer, minimum: 1, examples: [1] }
                dataOcorrencia:
                  type: string
                  format: date
                  description: Data do atendimento; hoje ou antes
                  examples: ['2026-10-27']
                turnoId: { type: integer, minimum: 1, description: 'Opcional; turno ativo' }
                etapaId:
                  type: integer
                  minimum: 1
                  description: Opcional; etapa ativa do mesmo setor
                profissionalCitado:
                  type: string
                  maxLength: 120
                  description: Opcional; sem HTML; vazio conta como não informado
                  examples: [Enfermeira Fulana]
                texto:
                  type: string
                  maxLength: 2000
                  description: >
                    Relato, sem HTML. Pode faltar só quando há telefone para retorno.
                  examples: [Carta entregue na recepção sobre a demora no atendimento.]
                telefone:
                  type: string
                  maxLength: 30
                  description: Opcional; com DDD, em qualquer formato. Exige aceiteTermos e termoId.
                  examples: ['(51) 99999-9999']
                aceiteTermos:
                  type: boolean
                  description: Consentimento obtido pela Ouvidoria no contato; precisa ser true com telefone
                termoId:
                  type: integer
                  minimum: 1
                  description: Versão vigente dos termos de privacidade (GET /api/publico/termos)
      responses:
        '201':
          description: Manifestação registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestacaoDetalhe'
        '400':
          description: >
            Dados inválidos (DADOS_INVALIDOS), como tipo ausente, canal PESQUISA, telefone sem o aceite
            ou sem a versão dos termos, ou nem texto nem telefone; ou telefone em formato inválido
            (TELEFONE_INVALIDO)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '409':
          description: Os termos aceitos não são os vigentes (TERMO_DESATUALIZADO)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '422':
          description: >
            Setor inexistente (SETOR_INEXISTENTE) ou desativado (SETOR_INATIVO), etapa que não é do
            setor (ETAPA_DE_OUTRO_SETOR) ou desativada (ETAPA_INATIVA), turno inexistente ou
            desativado (TURNO_INDISPONIVEL) ou data depois de hoje (DATA_FUTURA)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/manifestacoes/alertas:
    get:
      tags: [Ouvidoria]
      summary: Pedidos de retorno sem contato há mais de 48 horas úteis (só Super Admin)
      description: >
        Manifestações em que o paciente pediu retorno, ainda com status NOVA (nenhuma tentativa de
        contato) e criadas há mais de 48 horas úteis (RF16). Contam as 24 horas de cada dia de
        segunda a sexta, no horário de Brasília; feriados não são descontados. Calculado na hora da
        consulta, da mais antiga para a mais nova. Não traz o texto nem o telefone.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Chamados atrasados (lista vazia se nenhum)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ManifestacaoAlerta'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
  /api/manifestacoes/{id}:
    get:
      tags: [Ouvidoria]
      summary: Detalhe de um chamado, com o telefone decifrado (só Super Admin)
      description: >
        Única rota em que o telefone do paciente aparece, decifrado (RNF10). Traz também o texto do
        relato, o profissional citado (só nas manifestações de outros canais), as tentativas de
        contato com o nome de quem registrou e os anexos (só os metadados; a foto é vista em
        /api/manifestacoes/{id}/anexos/{anexoId}). Num chamado finalizado o telefone já foi apagado
        (RN07) e vem null.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Número de protocolo
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Chamado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestacaoDetalhe'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          description: Manifestação não encontrada (MANIFESTACAO_NAO_ENCONTRADA)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/manifestacoes/{id}/tipo:
    put:
      tags: [Ouvidoria]
      summary: Classifica a manifestação ou corrige o tipo (só Super Admin)
      description: >
        Define o tipo de uma manifestação que chegou "a classificar" ou corrige o tipo de qualquer
        manifestação, mesmo finalizada (RN12, D14). O tipo é obrigatório: uma manifestação
        classificada nunca volta a ficar sem tipo. Cada mudança grava no log o tipo anterior e o
        novo (RNF11); enviar o tipo que ela já tem não grava nada. Devolve o chamado atualizado,
        como o GET /api/manifestacoes/{id}.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Número de protocolo
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo]
              additionalProperties: false
              properties:
                tipo: { type: string, enum: [ELOGIO, RECLAMACAO, SUGESTAO] }
      responses:
        '200':
          description: Chamado com o tipo novo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestacaoDetalhe'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          description: Manifestação não encontrada (MANIFESTACAO_NAO_ENCONTRADA)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/manifestacoes/{id}/tentativas:
    post:
      tags: [Ouvidoria]
      summary: Registra uma tentativa de contato com o paciente (só Super Admin)
      description: >
        Só em chamado aberto (NOVA ou EM_CONTATO) em que o paciente pediu retorno (RF15). Quem
        registrou é o usuário logado. A primeira tentativa muda o status de NOVA para EM_CONTATO,
        tira o chamado do alerta de 48 horas (RF16) e grava a mudança no log (RNF11). Devolve o
        chamado atualizado, como o GET /api/manifestacoes/{id}.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Número de protocolo
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [realizadaEm, resultado]
              additionalProperties: false
              properties:
                realizadaEm:
                  type: string
                  format: date-time
                  description: Data e hora do contato, com fuso; não pode estar no futuro
                  examples: ['2026-10-30T14:00:00-03:00']
                resultado: { type: string, enum: [CONTATO_REALIZADO, SEM_SUCESSO] }
                observacao:
                  type: string
                  maxLength: 2000
                  description: Sem HTML; vazia é gravada como null
                  examples: [Caixa postal.]
      responses:
        '201':
          description: Tentativa registrada; chamado atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestacaoDetalhe'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          description: Manifestação não encontrada (MANIFESTACAO_NAO_ENCONTRADA)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '409':
          description: O chamado já foi finalizado (CHAMADO_JA_FINALIZADO)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '422':
          description: >
            Chamado anônimo, sem telefone para contato (CHAMADO_SEM_TELEFONE), ou data e hora no
            futuro (DATA_FUTURA)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/manifestacoes/{id}/finalizacao:
    post:
      tags: [Ouvidoria]
      summary: Finaliza o chamado como Encerrada ou Sem retorno (só Super Admin)
      description: >
        O desfecho é obrigatório (RN07) e o chamado precisa ter o tipo definido (RN12). Sem retorno
        exige pelo menos 3 tentativas de contato sem sucesso e só vale para quem pediu retorno; a
        manifestação anônima vai de NOVA direto para ENCERRADA. Numa só transação, o status muda, o
        desfecho e a data são gravados, o telefone e o hash são apagados (RNF12) e o log recebe a
        ação ANONIMIZACAO, sem o número. pediuRetorno continua true (D7). Devolve o chamado
        atualizado, já com telefone null.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Número de protocolo
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, desfecho]
              additionalProperties: false
              properties:
                status: { type: string, enum: [ENCERRADA, SEM_RETORNO] }
                desfecho:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: Sem HTML; só espaços conta como vazio (400)
                  examples: [Paciente orientada; reclamação encaminhada à coordenação do setor.]
      responses:
        '200':
          description: Chamado finalizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestacaoDetalhe'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          description: Manifestação não encontrada (MANIFESTACAO_NAO_ENCONTRADA)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '409':
          description: O chamado já foi finalizado (CHAMADO_JA_FINALIZADO)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '422':
          description: >
            Chamado ainda a classificar (TIPO_NAO_DEFINIDO), Sem retorno com menos de 3 tentativas
            sem sucesso (CHAMADO_SEM_TENTATIVAS_SUFICIENTES) ou Sem retorno num chamado anônimo
            (CHAMADO_SEM_TELEFONE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/manifestacoes/{id}/anexos:
    post:
      tags: [Ouvidoria]
      summary: Anexa a foto de uma manifestação recebida por escrito (só Super Admin)
      description: >
        Uma foto por envio, no campo "foto", até 300 KB (o frontend já reduz a foto antes de
        enviar). Só JPEG, PNG ou WebP, reconhecidos pelos primeiros bytes do arquivo, e não pela
        extensão nem pelo tipo declarado. Só em manifestação do canal PAPEL, com o chamado aberto, e
        no máximo 3 fotos por manifestação (RF17). Quem enviou é o usuário logado, e o envio vai para
        o log (CRIACAO) só com os metadados da foto (RNF11). Devolve o chamado atualizado, como o GET
        /api/manifestacoes/{id}, com a foto nova em anexos.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Número de protocolo
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [foto]
              properties:
                foto:
                  type: string
                  format: binary
                  description: Imagem JPEG, PNG ou WebP de até 300 KB
      responses:
        '201':
          description: Foto anexada; chamado atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestacaoDetalhe'
        '400':
          description: >
            Foto ausente (FOTO_AUSENTE), conteúdo que não é JPEG, PNG nem WebP (FOTO_INVALIDA), mais de
            um arquivo, outro campo ou campos a mais (ENVIO_INVALIDO) ou id inválido (DADOS_INVALIDOS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          description: Manifestação não encontrada (MANIFESTACAO_NAO_ENCONTRADA)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '409':
          description: O chamado já foi finalizado (CHAMADO_JA_FINALIZADO)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '413':
          description: A foto passa de 300 KB (ARQUIVO_GRANDE_DEMAIS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '422':
          description: >
            Manifestação de outro canal que não o papel (ANEXO_SO_PAPEL) ou que já tem 3 fotos
            (LIMITE_DE_FOTOS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/manifestacoes/{id}/anexos/{anexoId}:
    get:
      tags: [Ouvidoria]
      summary: Devolve uma foto anexada (só Super Admin)
      description: >
        A imagem, com o Content-Type gravado no envio, para o navegador exibir. Sem cache
        (Cache-Control private, no-store), porque a foto pode ter dados pessoais. A foto precisa ser
        da manifestação da URL.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Número de protocolo
          schema: { type: integer, minimum: 1 }
        - name: anexoId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: A imagem
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          description: Foto não encontrada nesta manifestação (ANEXO_NAO_ENCONTRADO)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
components:
  schemas:
    ManifestacaoReferencia:
      type: object
      required: [id, nome]
      properties:
        id: { type: integer, examples: [1] }
        nome: { type: string, examples: [Pronto Atendimento] }
    ManifestacaoItem:
      type: object
      required:
        - id
        - protocolo
        - origem
        - tipo
        - status
        - dataOcorrencia
        - pediuRetorno
        - possivelDuplicata
        - criadoEm
        - setor
        - etapa
        - turno
        - notaGeral
        - tentativasContato
      properties:
        id: { type: integer, examples: [42] }
        protocolo: { type: integer, description: O próprio id, examples: [42] }
        origem: { type: string, enum: [PESQUISA, TELEFONE, PRESENCIAL, EMAIL, PAPEL] }
        tipo:
          type: [string, 'null']
          enum: [ELOGIO, RECLAMACAO, SUGESTAO, null]
          description: null = a classificar pela Ouvidoria (RN12)
        status: { type: string, enum: [NOVA, EM_CONTATO, ENCERRADA, SEM_RETORNO] }
        dataOcorrencia: { type: string, format: date, examples: ['2026-10-30'] }
        pediuRetorno: { type: boolean }
        possivelDuplicata:
          type: boolean
          description: Mesmo telefone e setor em 24 horas (RF19); só um aviso
        criadoEm: { type: string, format: date-time }
        setor:
          $ref: '#/components/schemas/ManifestacaoReferencia'
        etapa:
          oneOf:
            - $ref: '#/components/schemas/ManifestacaoReferencia'
            - type: 'null'
        turno:
          oneOf:
            - $ref: '#/components/schemas/ManifestacaoReferencia'
            - type: 'null'
        notaGeral:
          type: [integer, 'null']
          description: Nota geral da sessão (0 a 10); null fora da pesquisa ou sem nota
        tentativasContato: { type: integer, examples: [0] }
    ManifestacaoPagina:
      type: object
      required: [itens, total, pagina, tamanho, totalNovas]
      properties:
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ManifestacaoItem'
        total: { type: integer }
        pagina: { type: integer }
        tamanho: { type: integer }
        totalNovas:
          type: integer
          description: Chamados NOVA em todo o sistema, sem os filtros (menu lateral)
    ManifestacaoAlerta:
      allOf:
        - $ref: '#/components/schemas/ManifestacaoItem'
        - type: object
          required: [horasUteisSemContato]
          properties:
            horasUteisSemContato: { type: integer, examples: [52] }
    ManifestacaoDetalhe:
      allOf:
        - $ref: '#/components/schemas/ManifestacaoItem'
        - type: object
          required:
            - texto
            - telefone
            - profissionalCitado
            - consentimentoEm
            - termoPrivacidade
            - registradaPor
            - desfecho
            - finalizadaEm
            - atualizadoEm
            - tentativas
            - anexos
          properties:
            texto: { type: [string, 'null'] }
            telefone:
              type: [string, 'null']
              description: Decifrado, só dígitos (55 + DDD + número); null sem pedido de retorno ou depois da finalização
              examples: ['5551999999999']
            profissionalCitado: { type: [string, 'null'] }
            consentimentoEm: { type: [string, 'null'], format: date-time }
            termoPrivacidade:
              description: Versão dos termos aceita junto com o telefone
              oneOf:
                - type: object
                  required: [id, versao]
                  properties:
                    id: { type: integer }
                    versao: { type: integer }
                - type: 'null'
            registradaPor:
              description: Quem registrou uma manifestação de outro canal; null na pesquisa
              oneOf:
                - $ref: '#/components/schemas/ManifestacaoReferencia'
                - type: 'null'
            desfecho: { type: [string, 'null'] }
            finalizadaEm: { type: [string, 'null'], format: date-time }
            atualizadoEm: { type: string, format: date-time }
            tentativas:
              type: array
              items:
                type: object
